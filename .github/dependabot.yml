version: 2

updates:
  # ── Yarn / npm (Next.js app) ─────────────────────────────────────────────────
  - package-ecosystem: 'npm' # Correct for Yarn — updates yarn.lock
    directory: '/' # Root (package.json + yarn.lock)
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00' # Predictable time → fewer rebases
      timezone: 'Etc/UTC'
    target-branch: 'staging'
    open-pull-requests-limit: 12 # Slightly higher is fine with groups
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore(dev)' # Distinguishes dev vs prod commits
      include: 'scope'
    groups:
      nextjs-and-react-core: # High-risk → review majors manually
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'patch'
          - 'minor' # Exclude majors (Next.js breaking changes)

      markdown-and-parsing: # Your markdown → HTML flow
        patterns:
          - 'marked'
          - 'gray-matter'
          - 'html-react-parser'

      github-integration: # Octokit / Vercel / auth
        patterns:
          - '@octokit/*'
          - 'octokit'
          - '@vercel/analytics'

      ui-and-utils: # Smaller utils & UI
        patterns:
          - 'react-hot-toast'
          - 'react-icons'
          - 'react-cookie*'
          - 'react-cookie-consent'
          - 'zod'
          - 'uuid'
          - '@microlink/react-json-view'
          - 'color-interpolate'

      dev-and-testing: # Vitest, Playwright, linting
        dependency-type: 'development'
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - '@playwright/test'
          - '@axe-core/playwright'
          - '@testing-library/*'
          - 'typescript'
          - '@types/*'
          - 'eslint*'
          - 'eslint-config-next'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
          - 'jsdom'
          - 'tsx'
          - 'ts-node'
          - 'dotenv'

      other-deps: # Catch-all fallback
        patterns:
          - '*'

    ignore:
      # TypeScript 7 is not yet usable here, so hold the major and keep taking
      # 6.x patches and minors. Two blockers, both upstream:
      #   - next build refuses: "TypeScript 7.0.2 does not provide the compiler
      #     API required by Next.js ... or install TypeScript 6 instead", which
      #     also fails both Vercel deployments
      #   - typescript-eslint errors on import; 8.70.0 declares peer typescript
      #     ">=4.8.4 <6.1.0" and upstream is tracking TS >=7.1, skipping 7.0
      #     (typescript-eslint/typescript-eslint#10940)
      # Remove this once Next.js supports the TS 7 compiler API and
      # typescript-eslint ships TS 7 support. See #421.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Recommended addition: GitHub Actions (you likely have workflows)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Etc/UTC'
    target-branch: 'staging'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*' # Usually 1 small PR
