name: Dependabot - Auto-Merge Safe updates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # Patch updates only.
      #
      # The rule here previously also admitted minor updates whose group name
      # contained 'dev' or 'tooling'. No group is named 'tooling', and of the
      # seven groups in dependabot.yml only 'dev-and-testing' contains 'dev',
      # so in practice that clause admitted exactly one thing: minor updates
      # to Vitest, Playwright, ESLint and TypeScript - the group whose minors
      # have broken the build before (TypeScript 7 and Vitest 5, see #421).
      # The exception was pointed at the riskiest group rather than away from
      # it, and excluding 'dev-and-testing' would have left it matching
      # nothing at all, so dropping it outright is the same change. See #474.
      #
      # For a grouped PR, dependabot/fetch-metadata reports the highest update
      # type across the group's members, so a group carrying any minor is held
      # for a human to read. That is the intent, not a side effect.
      - name: Approve & enable auto-merge (patch updates only)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
