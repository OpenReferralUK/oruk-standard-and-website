name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, staging]
  push:
    # Pushes to staging are largely covered by the pull_request run on the
    # merge ref, but a direct push or an admin merge would otherwise get no CI
    # at all, so staging is kept here deliberately.
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  security-events: write # Required for Trivy/CodeQL SARIF upload

jobs:
  # --- JOB 1: BRANCH GATE ---
  # Ensures that PRs to 'main' ONLY come from 'staging'.
  branch-gate:
    name: Validate PR Source
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch flow
        run: |
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "staging" ]]; then
            echo "::error::Illegal merge: PRs to 'main' must originate from 'staging'."
            exit 1
          fi
          echo "Branch flow validated."

  # --- JOB 2: BUILD, TEST & QUALITY ---
  build-and-test:
    name: Build, Test & Coverage
    needs: branch-gate
    # Runs when branch-gate passed, or was skipped because this is a push.
    if: |
      always() &&
      (needs.branch-gate.result == 'success' || needs.branch-gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Corepack must be enabled before the cache-enabled setup-node below:
      # that step shells out to `yarn cache dir`, and the runner's global
      # Yarn 1 refuses to run once package.json pins packageManager to Yarn 4.
      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Next.js build
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-

      - name: Lint & type check
        run: |
          yarn lint
          yarn tsc --noEmit

      - name: Build
        run: yarn build

      - name: Run tests with coverage
        run: yarn test --coverage --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: ./coverage
          if-no-files-found: warn
          retention-days: 14

  # --- JOB 3: PARALLEL SCANS (matrix) ---
  parallel-checks:
    name: ${{ matrix.check }} Scan
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'success'
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [trivy-fs, playwright-a11y, codeql]
    steps:
      - uses: actions/checkout@v7.0.1

      # --- CodeQL ---
      - name: Initialize CodeQL
        if: matrix.check == 'codeql'
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        if: matrix.check == 'codeql'
        uses: github/codeql-action/analyze@v4.37.9

      # --- Playwright accessibility ---
      # This leg needs Node and dependencies, so it repeats the Corepack
      # ordering used by build-and-test.
      - name: Setup Node.js
        if: matrix.check == 'playwright-a11y'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        if: matrix.check == 'playwright-a11y'
        run: corepack enable

      - name: Restore Yarn cache
        if: matrix.check == 'playwright-a11y'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Cache Playwright browsers
        if: matrix.check == 'playwright-a11y'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Playwright accessibility tests
        if: matrix.check == 'playwright-a11y'
        run: |
          yarn install --immutable
          npx playwright install --with-deps chromium
          yarn e2e src/e2e/accessibility.spec.ts
        env:
          CI: true

      - name: Upload Playwright reports
        if: always() && matrix.check == 'playwright-a11y'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: accessibility-reports
          path: |
            accessibility-report/
            playwright-report/
          retention-days: 14

      # --- Trivy filesystem ---
      - name: Cache Trivy DB
        if: matrix.check == 'trivy-fs'
        uses: actions/cache@v6.1.0
        with:
          path: .trivycache
          key: trivy-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Trivy filesystem scan
        if: matrix.check == 'trivy-fs'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,UNKNOWN'
          exit-code: '0' # Reported via SARIF; the gatekeeper decides pass/fail
          cache-dir: .trivycache

      - name: Upload Trivy FS SARIF
        if: always() && matrix.check == 'trivy-fs'
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-fs-results.sarif

  # --- JOB 4: DOCKER IMAGE + DAST ---
  # The image is built and loaded locally rather than pushed to GHCR: nothing
  # outside this workflow consumes it, so a registry push only accumulated
  # packages that were dead minutes after being created.
  docker-and-dast:
    name: Docker & ZAP Scan
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build local image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true # Load into the local daemon instead of pushing
          tags: oruk-standard-and-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy DB
        uses: actions/cache@v6.1.0
        with:
          path: .trivycache
          key: trivy-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'oruk-standard-and-website:ci'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,UNKNOWN'
          exit-code: '0'
          cache-dir: .trivycache

      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-image-results.sarif

      - name: Start application container
        run: docker run -d --name test-app -p 3000:3000 oruk-standard-and-website:ci

      - name: Wait for application readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Application health check passed (/api/health)"
              exit 0
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done
          echo "::error::Application failed readiness check after 60 seconds"
          docker logs test-app || true
          exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: 'zap-security-report'
          # Findings are published as an artifact rather than filed as GitHub
          # issues, so a noisy scan cannot spam the issue tracker.
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Stop application container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true

  # --- JOB 5: FINAL STATUS (the gatekeeper) ---
  # This is the single check that branch protection should require.
  workflow-status:
    name: Final Workflow Status
    needs: [branch-gate, build-and-test, parallel-checks, docker-and-dast]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          gate='${{ needs.branch-gate.result }}'
          build='${{ needs.build-and-test.result }}'
          checks='${{ needs.parallel-checks.result }}'
          docker='${{ needs.docker-and-dast.result }}'

          echo "branch-gate:     $gate"
          echo "build-and-test:  $build"
          echo "parallel-checks: $checks"
          echo "docker-and-dast: $docker"

          status=0

          # branch-gate is legitimately skipped on push events. Every other job
          # must have actually succeeded: a 'skipped' result means an upstream
          # failure short-circuited the pipeline, which is not a pass.
          if [[ "$gate" != 'success' && "$gate" != 'skipped' ]]; then
            echo "::error::branch-gate did not pass (result: $gate)"
            status=1
          fi

          for entry in "build-and-test:$build" "parallel-checks:$checks" "docker-and-dast:$docker"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" != 'success' ]]; then
              echo "::error::$name did not succeed (result: $result)"
              status=1
            fi
          done

          if [[ "$status" -eq 0 ]]; then
            echo "All checks passed."
          fi

          exit "$status"

  # --- JOB 6: RELEASE ---
  create-release:
    name: Create GitHub Release
    needs: workflow-status
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.workflow-status.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
